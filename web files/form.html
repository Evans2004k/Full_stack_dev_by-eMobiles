<body>
    
    <header>
        <div>
            <img src="static/images/programmer.jpg" alt="Logo" height="100" width="100">
        </div>
        <div><button>dark mode</button></div>
        <div id="tittle">
            <h1>Web Development Tutorial</h1>
            <nav>

<span>

        <div id="container">
            <div id="logo">
                <p>Ev</p>
            </div>
            <h1>Create an Account</h1>
            <p id="subtittle">Join us now and get started</p>
            <form action="" method="post">
                <div class="input-group">
                    <label for="full name">Full Name:</label>
                    <input type="text" id="full name" name="fullname" placeholder="Enter your Name:">
                </div> <br> 
                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your Email:">
                </div>
                <br>
                <div class="input-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter your Password:">
                </div>
                <br>
                <div class="input-group">
                    <label for="confirm password">Confirm Password:</label>
                    <input type="password" id="confirm password" name="confirmpassword" placeholder="Confirm your Password:">
                </div>
               
                 <br>
                <div class="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="">Terms and Conditions</a> </label>
                </div>
                <br>
                 <br>
                 <button type="submit">Create An Account</button>
                 <br>
                
            </form>
    
            <p class="login">Already have an Account?</p>
            <a href=""><link rel="import" href="component.html">login</a>
           
        </div>
</span>
